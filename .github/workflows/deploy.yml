name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de l'image a deployer"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      TAG: ${{ inputs.tag }}

    steps:
      - name: Valider le tag
        run: |
          if [[ ! "$TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Tag invalide"
            exit 1
          fi

      - name: Preparer SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts

      - name: Tester la connexion SSH
        run: |
          ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "whoami && docker ps"

      - name: Deployer sur EC2
        run: |
          ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd /opt/atlas && ./deploy.sh '$TAG'"

      - name: Verifier application
        run: |
          curl --fail --max-time 10 \
            "http://$SSH_HOST/api/health"

      - name: Nettoyer la cle privee
        if: always()
        run: rm -f ~/.ssh/id_ed25519